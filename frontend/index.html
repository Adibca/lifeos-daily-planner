<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>LifeOS Daily Planner</title>
    
    <!-- PWA Web App Manifest (Critical for Android Chrome Installability) -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Theme Color & Capabilities -->
    <meta name="theme-color" content="#090A0F" />
    <meta name="description" content="Personal productivity suite with routines, habits, time blocking & cross-device sync." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LifeOS" />
    <meta name="format-detection" content="telephone=no" />

    <!-- App Icons -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64x64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#6366F1" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-dark-900 text-slate-100 antialiased selection:bg-brand-500 selection:text-white overscroll-none select-none">
    <div id="root"></div>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((reg) => {
              console.log('[LifeOS] Service Worker successfully registered with scope:', reg.scope);
            })
            .catch((err) => {
              console.error('[LifeOS] Service Worker registration error:', err);
            });
        });
      }
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
